model:
  name: distilbert-base-uncased
  num_labels: 2
  max_length: 256

data:
  dataset: stanfordnlp/imdb
  train_split: train
  test_split: test
  # Set to an int (e.g. 2000) for a quick smoke run; null uses the full split
  max_train_samples: null
  max_eval_samples: null

training:
  output_dir: outputs/distilbert-imdb
  num_train_epochs: 3
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 32
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_steps: 500
  logging_steps: 100
  eval_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: f1
  greater_is_better: true
  seed: 42
  fp16: false  # set true if you have a CUDA GPU with fp16 support

inference:
  model_dir: outputs/distilbert-imdb
  labels:
    0: negative
    1: positive
